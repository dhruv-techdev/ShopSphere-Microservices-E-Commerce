server:
  port: 8084

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shopsphere?currentSchema=shopsphere_orders
    username: shopsphere
    password: shopsphere
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS shopsphere_orders

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: shopsphere_orders
    open-in-view: false

app:
  product-service:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
  cart-service:
    base-url: ${CART_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.shopsphere.orderservice: DEBUG
    org.hibernate.SQL: DEBUG
