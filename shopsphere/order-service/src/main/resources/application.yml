server:
  port: 8084

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shopsphere?currentSchema=shopsphere_orders
    username: shopsphere
    password: shopsphere
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS shopsphere_orders

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: shopsphere_orders
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                       # wait for all in-sync replicas — strongest durability
      retries: 3
      properties:
        enable.idempotence: true     # no duplicate writes on retry
        max.in.flight.requests.per.connection: 5
        linger.ms: 5                  # batch writes within 5ms — small latency, much better throughput
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.shopsphere.common.events"
        spring.json.use.type.headers: false

app:
  product-service:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
  cart-service:
    base-url: ${CART_SERVICE_URL:http://localhost:8083}
  inventory-service:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.shopsphere.orderservice: DEBUG
    org.hibernate.SQL: DEBUG
