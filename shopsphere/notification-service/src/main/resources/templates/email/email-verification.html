<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title th:text="${subject}">Confirm your email</title></head>
<body style="margin:0;padding:24px;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#111827;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:8px;padding:24px;">
    <tr><td>
        <div th:replace="~{email/fragments :: header}"></div>
        <p>Hi <span th:text="${recipientName}">there</span>,</p>
        <p>Thanks for signing up! Please confirm your email address to activate your account.</p>
        <p style="margin:24px 0;">
            <a th:href="${actionUrl}" href="#"
               style="background:#111827;color:#ffffff;padding:12px 20px;border-radius:6px;text-decoration:none;display:inline-block;">
                Confirm email address</a>
        </p>
        <p style="font-size:13px;color:#6b7280;">
            This link expires on <span th:text="${expiresAt}">soon</span>. If the button doesn't work,
            copy this address into your browser:<br>
            <span th:text="${actionUrl}" style="word-break:break-all;">link</span>
        </p>
        <p style="font-size:13px;color:#6b7280;">If you didn't create a ShopSphere account, you can ignore this email.</p>
        <div th:replace="~{email/fragments :: footer}"></div>
    </td></tr>
</table>
</body>
</html>
