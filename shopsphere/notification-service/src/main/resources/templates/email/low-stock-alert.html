<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title th:text="${subject}">Low stock</title></head>
<body style="margin:0;padding:24px;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#111827;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:8px;padding:24px;">
    <tr><td>
        <div th:replace="~{email/fragments :: header}"></div>
        <p>Hi <span th:text="${recipientName}">team</span>,</p>
        <p>Product <strong th:text="${productId}">1</strong> is running low.</p>
        <table role="presentation" cellpadding="6" style="border-collapse:collapse;">
            <tr><td style="color:#6b7280;">Sellable</td><td th:text="${sellableQuantity}">0</td></tr>
            <tr><td style="color:#6b7280;">Threshold</td><td th:text="${threshold}">10</td></tr>
            <tr><td style="color:#6b7280;">Available</td><td th:text="${availableQuantity}">0</td></tr>
            <tr><td style="color:#6b7280;">Reserved</td><td th:text="${reservedQuantity}">0</td></tr>
        </table>
        <div th:replace="~{email/fragments :: footer}"></div>
    </td></tr>
</table>
</body>
</html>
