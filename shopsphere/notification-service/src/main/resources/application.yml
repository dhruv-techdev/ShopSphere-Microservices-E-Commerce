server:
  port: 8087

spring:
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/shopsphere?currentSchema=shopsphere_notifications
    username: shopsphere
    password: shopsphere
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS shopsphere_notifications

  # US36 — Flyway owns the schema. Existing (Hibernate-created) DBs are baselined at V1.
  flyway:
    enabled: true
    schemas: shopsphere_notifications
    default-schema: shopsphere_notifications
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Pre-Flyway Hibernate-managed schema

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: shopsphere_notifications
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    # US40 — producer for notification.dlq
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

  # US39 — SMTP (used when app.notification.channel=smtp). Defaults target Mailpit.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  thymeleaf:
    check-template-location: true
    cache: true

app:
  notification:
    # log (default, no email sent) | smtp | sendgrid — see config-service for per-environment overrides
    channel: ${NOTIFICATION_CHANNEL:log}
    from-address: ${NOTIFICATION_FROM:no-reply@shopsphere.local}
    from-name: ${NOTIFICATION_FROM_NAME:ShopSphere}
    admin-email: ${NOTIFICATION_ADMIN_EMAIL:ops@shopsphere.local}
    sendgrid:
      api-key: ${SENDGRID_API_KEY:}
      base-url: ${SENDGRID_BASE_URL:https://api.sendgrid.com}
    # US40 — exponential backoff: initial-delay * multiplier^(attempt-1), capped at max-delay
    retry:
      enabled: ${NOTIFICATION_RETRY_ENABLED:true}
      max-attempts: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:5}
      initial-delay: ${NOTIFICATION_RETRY_INITIAL_DELAY:30s}
      multiplier: ${NOTIFICATION_RETRY_MULTIPLIER:2.0}
      max-delay: ${NOTIFICATION_RETRY_MAX_DELAY:30m}
      lease: 5m
      batch-size: 50
      poll-interval-ms: ${NOTIFICATION_RETRY_POLL_INTERVAL_MS:15000}
      initial-poll-delay-ms: 20000
  user-service:
    base-url: ${USER_SERVICE_URL:http://localhost:8082}
  internal:
    token: ${INTERNAL_API_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false   # SMTP may be unused (log/sendgrid); don't mark the service DOWN for it
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.shopsphere.notificationservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
