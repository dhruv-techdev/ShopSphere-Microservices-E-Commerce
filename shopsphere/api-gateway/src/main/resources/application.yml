server:
  port: 8080

spring:
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # ---------- User Service ----------
        - id: user-service-auth
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service-users
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**
        # US46 — admin user list
        - id: user-service-admin
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/admin/users/**

        # ---------- Product Service ----------
        - id: product-service-products
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/products/**
        - id: product-service-categories
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/categories/**

        # ---------- Cart Service ----------
        - id: cart-service
          uri: ${CART_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/carts/**

        # ---------- Order Service ----------
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/orders/**
        # US42 — admin order management (US46: + /reconciliation)
        - id: order-service-admin
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/admin/orders/**

        # ---------- Inventory Service ----------
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/inventory/**

        # ---------- Payment Service ----------
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/payments/**
        # US46 — admin payment reconciliation
        - id: payment-service-admin
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/admin/payments/**

        # ---------- Notification Service ----------
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/notifications/**
        # US46 — admin notification log
        - id: notification-service-admin
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/admin/notifications/**

        # ---------- Shipping Service (.NET 8 + Steeltoe) ----------
        - id: shipping-service
          uri: ${SHIPPING_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/shipments/**

        # ---------- Recommendation Service (Python, US63) — resolved through Eureka ----------
        - id: recommendation-service
          uri: ${RECOMMENDATION_SERVICE_URL:lb://recommendation-service}
          predicates:
            - Path=/api/v1/recommendations/**

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-256-bits-for-hs256}
  security:
    # Routes the gateway lets through without a JWT
    public-paths:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /api/v1/auth/email-verification/confirm
      - /api/v1/auth/email-verification/resend
      - /api/v1/auth/password-reset/request
      - /api/v1/auth/password-reset/confirm
      - /api/v1/users/health
      - /api/v1/products/health
      - /api/v1/carts/health
      - /api/v1/orders/health
      - /api/v1/inventory/health
      - /api/v1/payments/health
      - /api/v1/notifications/health
      - /api/v1/shipments/health
      - /api/v1/recommendations/health
      - /actuator/health
    # GET on these path prefixes is public (browsing catalog without login)
    public-get-prefixes:
      - /api/v1/products
      - /api/v1/categories
      - /api/v1/recommendations
    # Admin-only path prefixes (POST/PUT/DELETE → ADMIN required)
    admin-write-prefixes:
      - /api/v1/products
      - /api/v1/categories
      - /api/v1/inventory
      - /api/v1/shipments
    # US42 — ADMIN required for every method
    admin-prefixes:
      - /api/v1/admin

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.shopsphere.gateway: DEBUG
    org.springframework.cloud.gateway: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
