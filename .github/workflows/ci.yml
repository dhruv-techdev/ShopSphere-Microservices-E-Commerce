name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java:
    name: Java — Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test all modules
        run: mvn -f shopsphere/pom.xml clean verify --no-transfer-progress

  dotnet:
    name: .NET — Build & Test (shipping-service)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore shopsphere/shipping-service/tests/ShippingService.Tests/ShippingService.Tests.csproj

      - name: Build
        run: dotnet build shopsphere/shipping-service/tests/ShippingService.Tests/ShippingService.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test shopsphere/shipping-service/tests/ShippingService.Tests/ShippingService.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipping-service-test-results
          path: shopsphere/shipping-service/tests/ShippingService.Tests/TestResults/

  admin-app:
    name: Angular — Build & Test (admin-app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopsphere/admin-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: shopsphere/admin-app/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests (headless Chrome)
        run: npm run test:ci

      - name: Production build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-app-coverage
          path: shopsphere/admin-app/coverage/

  recommendation:
    name: Python — Test (recommendation-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopsphere/recommendation-service

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopsphere
          POSTGRES_PASSWORD: shopsphere
          POSTGRES_DB: shopsphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopsphere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://shopsphere:shopsphere@localhost:5432/shopsphere_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: shopsphere/recommendation-service/requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint + type check
        run: |
          ruff check .
          ruff format --check .
          mypy app

      - name: Unit + repository tests
        run: python -m pytest --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-service-test-results
          path: shopsphere/recommendation-service/test-results.xml

  docker:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [java, dotnet, admin-app, recommendation]

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: service-registry
            context: ./shopsphere
          - service: config-service
            context: ./shopsphere
          - service: api-gateway
            context: ./shopsphere
          - service: user-service
            context: ./shopsphere
          - service: product-service
            context: ./shopsphere
          - service: cart-service
            context: ./shopsphere
          - service: order-service
            context: ./shopsphere
          - service: inventory-service
            context: ./shopsphere
          - service: payment-service
            context: ./shopsphere
          - service: notification-service
            context: ./shopsphere
          - service: shipping-service
            context: ./shopsphere/shipping-service
          - service: admin-app
            context: ./shopsphere/admin-app
          - service: recommendation-service
            context: ./shopsphere/recommendation-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ./shopsphere/${{ matrix.service }}/Dockerfile
          push: false
          build-args: SERVICE_DIR=${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  e2e:
    name: E2E — Selenium (admin console)
    runs-on: ubuntu-latest
    needs: [java, dotnet, admin-app, recommendation]
    timeout-minutes: 60
    env:
      COMPOSE: docker compose -f shopsphere/docker-compose.yml -f shopsphere/docker-compose.e2e.yml

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: shopsphere/e2e-tests/pom.xml

      - name: Start the stack
        run: $COMPOSE up -d --build --wait --wait-timeout 900

      - name: Selenium suite (headless Chrome)
        run: >
          mvn -f shopsphere/e2e-tests/pom.xml verify --no-transfer-progress
          -De2e.baseUrl=http://localhost:4200
          -De2e.apiUrl=http://localhost:8080
          -De2e.stackTimeoutSeconds=600

      - name: Collect container logs
        if: failure()
        run: |
          mkdir -p shopsphere/e2e-tests/target/e2e-artifacts
          $COMPOSE logs --no-color --timestamps > shopsphere/e2e-tests/target/e2e-artifacts/docker-compose.log

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            shopsphere/e2e-tests/target/surefire-reports/
            shopsphere/e2e-tests/target/e2e-artifacts/
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v --remove-orphans
