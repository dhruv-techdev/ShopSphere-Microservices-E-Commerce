name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  java:
    name: Java — Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test all modules
        run: mvn -f shopsphere/pom.xml clean verify --no-transfer-progress

  dotnet:
    name: .NET — Build & Test (shipping-service)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore shopsphere/shipping-service/tests/ShippingService.Tests/ShippingService.Tests.csproj

      - name: Build
        run: dotnet build shopsphere/shipping-service/tests/ShippingService.Tests/ShippingService.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test shopsphere/shipping-service/tests/ShippingService.Tests/ShippingService.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipping-service-test-results
          path: shopsphere/shipping-service/tests/ShippingService.Tests/TestResults/

  docker:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [java, dotnet]

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: service-registry
            context: ./shopsphere
          - service: config-service
            context: ./shopsphere
          - service: api-gateway
            context: ./shopsphere
          - service: user-service
            context: ./shopsphere
          - service: product-service
            context: ./shopsphere
          - service: cart-service
            context: ./shopsphere
          - service: order-service
            context: ./shopsphere
          - service: inventory-service
            context: ./shopsphere
          - service: payment-service
            context: ./shopsphere
          - service: notification-service
            context: ./shopsphere
          - service: shipping-service
            context: ./shopsphere/shipping-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ./shopsphere/${{ matrix.service }}/Dockerfile
          push: false
          build-args: SERVICE_DIR=${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
